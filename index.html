<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Жайна мені кешірші</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f7c6d0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    text-align:center;
}

h1{
    font-size:64px;
    margin-bottom:20px;
}

h2{
    font-size:40px;
    margin-bottom:40px;
}

.buttons{
    position:relative;
    width:500px;
    height:150px;
    margin:auto;
}

button{
    border:none;
    color:white;
    cursor:pointer;
    border-radius:15px;
    transition:0.3s;
}

#yesBtn{
    background:green;
    width:140px;
    height:80px;
    font-size:32px;
}

#noBtn{
    background:red;
    width:140px;
    height:80px;
    font-size:32px;
    position:absolute;
    left:280px;
    top:0;
}
</style>
</head>
<body>

<div class="container">
    <h1>Жайна мені кешірші ❤️</h1>
    <h2>Кешіресің бе?</h2>

    <div class="buttons">
        <button id="yesBtn">Ия</button>
        <button id="noBtn">Жоқ</button>
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

let yesSize = 1;

noBtn.addEventListener("mouseover", () => {

    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.position = "fixed";
    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";

    yesSize += 0.2;
    yesBtn.style.transform = `scale(${yesSize})`;
});

yesBtn.addEventListener("click", () => {
    document.body.innerHTML = `
    <div style="
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        background:#f7c6d0;
        font-family:Arial;">
        <h1 style="font-size:70px;">❤️ Рахмет Жаным ❤️</h1>
        <h2 style="margin-top:20px;">Сен ең жақсысың 😊</h2>
    </div>
    `;
});
</script>

</body>
</html>
